name: Deploy ke cPanel
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: if [ -f package.json ]; then npm ci; fi
      - run: node tools/generate.js

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy file utama via lftp
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "deploy1@bandungbersuara.jabarinfo.id,$FTP_PASSWORD" ftp://195.88.211.226 <<EOF
          set ftp:passive-mode true
          set net:reconnect-interval-base 5
          set net:max-retries 5
          set net:timeout 60
          set ftp:ssl-allow false
          mirror -R --delete --verbose \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob .github/ \
            --exclude-glob tools/ \
            --exclude-glob scripts/ \
            --exclude-glob article/ \
            --exclude-glob *.ps1 \
            --exclude-glob *.log \
            --exclude-glob package.json \
            --exclude-glob package-lock.json \
            --exclude-glob netlify.toml \
            ./ /portalnegeri/
          bye
          EOF

  deploy-articles:
    runs-on: ubuntu-latest
    needs: deploy-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: if [ -f package.json ]; then npm ci; fi
      - run: node tools/generate.js

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy folder article via lftp
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "deploy1@bandungbersuara.jabarinfo.id,$FTP_PASSWORD" ftp://195.88.211.226 <<EOF
          set ftp:passive-mode true
          set net:reconnect-interval-base 5
          set net:max-retries 5
          set net:timeout 60
          set ftp:ssl-allow false
          mirror -R --delete --verbose \
            ./article/ /portalnegeri/article/
          bye
          EOF
